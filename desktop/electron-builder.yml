# Empaquetado: Windows (x64; "dir" es la carpeta que se sube a Steam; "zip", para itch.io) y Mac (zip, para itch.io).
appId: com.magicpoker.game
productName: Magic Poker
copyright: Copyright © 2026 Magic Poker
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - preload.js
  - web/**/*
  - build/icon.png
asar: true
# Solo los idiomas del juego (el resto de traducciones de Chromium sobran)
electronLanguages: [en-US, es, es-419]
win:
  target:
    - target: dir
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.png
  executableName: MagicPoker
# Mac (para itch.io): un .zip por arquitectura (Apple Silicon y procesadores Intel), sin firmar
mac:
  target:
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.card-games
  identity: null
